  <meta charset="UTF-8" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Inter & Space Grotesk) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#f5c518',
            brandHover: '#e5b508',
            darkbg: '#0b0d12',
            darkcard: '#141721',
            darksurface: '#1b1f2e',
            darkborder: '#23283b',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0d12;
    }
    ::-webkit-scrollbar-thumb {
      background: #23283b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f5c518;
    }
  </style>
</head>
<body class="bg-darkbg text-slate-200 font-sans antialiased selection:bg-brand selection:text-black min-h-screen flex flex-col">

  <!-- Container Utama React App -->

  <!-- Script Logika React dalam JSX -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- DATA KONSTANTA ---
    const BISNIS = [
      { 
        id: "bengkel", 
        icon: "🏍️", 
        label: "Bengkel Motor", 
        val: "bengkel motor / otomotif",

      {

        sampleName: "Masbay Coffee & Eatery",

        sampleName: "Masbay Gentleman Barber", 
        sampleTag: "Potong Haircut Modern & Massage", 
        samplePromo: "PAKET CUKUR + WASH 30K", 
        sampleHarga: "Rp 30.000",
        samplePhone: "0821-7788-9900",
        sampleAddr: "Center Point Plaza Lt. 1"
      },
      { 
        id: "fashion", 
        icon: "👗", 
        label: "Fashion", 
        val: "toko fashion / distro", 
        visualEn: "modern stylish streetwear clothing flat lay arrangement, premium cotton fabric texture, aesthetic minimalist studio setup",
        sampleName: "Masbay Apparel Co.", 
        sampleTag: "Outfit Trendy Anak Muda Surakarta", 
        samplePromo: "CLEARANCE SALE DISKON 50%", 
        sampleHarga: "Mulai 50rb",
        samplePhone: "0819-3344-5566",
        sampleAddr: "Jl. Diponegoro No. 22"
      },
      { 
        id: "elektronik", 
        icon: "📱", 
        label: "Elektronik", 
        val: "toko gadget / service HP", 
        visualEn: "latest flagship smartphone mockup, glowing blue circuit neon accents, high-tech repair precision tools desk",
        sampleName: "Masbay Cell & Repair", 
        sampleTag: "Spesialis Ganti LCD & Battery", 
        samplePromo: "BONUS TEMPERED GLASS", 
        sampleHarga: "Bisa Ditunggu",
        samplePhone: "0888-2233-4455",
        sampleAddr: "Ruko Solo Grand Mall"
      },
      { 
        id: "properti", 
        icon: "🏠", 
        label: "Properti", 
        val: "properti / kos-kosan eksklusif", 
        visualEn: "modern minimalist house exterior design, warm sunset architectural lighting, cozy tropical landscaping",
        sampleName: "Kos Masbay Eksklusif", 
        sampleTag: "Fasilitas AC, Wi-Fi & Kamar Mandi Dalam", 
        samplePromo: "DISKON SEWA BULAN PERTAMA", 
        sampleHarga: "Rp 1.2jt / bulan",
        samplePhone: "0811-2233-4455",
        sampleAddr: "Kawasan Kampus UNS Surakarta"
      }
    ];

    const MOODS = [
      { id: "bold", label: "⚡ Bold & Edgy", val: "bold aggressive dark dramatic high-contrast striking", layoutEn: "dynamic asymmetric layout with strong diagonal contrast lines and sharp edgy accents" },
      { id: "clean", label: "🧊 Clean Modern", val: "clean professional minimalist modern sleek whitespace", layoutEn: "clean structured grid layout with generous whitespace and ultra-crisp edges" },
      { id: "luxury", label: "✨ Premium Gold", val: "luxury premium elegant dark gold sophisticated exclusive", layoutEn: "elegant centered visual hierarchy with fine gold geometric borders and subtle metallic shimmer" },
      { id: "neon", label: "🌈 Neon Cyber", val: "tech futuristic neon cyber glow hi-tech digital", layoutEn: "glowing cyan and magenta digital grid lines with dark cybernetic background motifs" }
    ];

    const PALETTES = [
      { id: "p1", label: "Merah & Hitam", val: "dominant crimson red (#D32F2F) and deep black (#0A0A0A), contrast white text", bg: "from-red-600 to-black", textCol: "#ffffff", accentCol: "#ef4444" },
      { id: "p2", label: "Biru & Putih", val: "dominant navy blue (#0D47A1) and crisp white (#FFFFFF), sky blue accent", bg: "from-blue-600 to-slate-950", textCol: "#ffffff", accentCol: "#38bdf8" },
      { id: "p3", label: "Hitam & Gold", val: "dominant pitch black (#0A0A0A) and metallic gold (#F5C518), elegant warm accent", bg: "from-amber-500 via-neutral-900 to-black", textCol: "#f5c518", accentCol: "#f5c518" },
      { id: "p4", label: "Hijau & Putih", val: "dominant emerald green (#1B5E20) and fresh white (#FFFFFF), mint accent", bg: "from-emerald-600 to-slate-950", textCol: "#ffffff", accentCol: "#34d399" }
    ];

    const UKURAN = [
      { id: "landscape", label: "Landscape", sub: "16:9 — FB / Spanduk", ar: "16:9", cssAspect: "aspect-[16/9]" },
      { id: "square", label: "Square", sub: "1:1 — IG Feed", ar: "1:1", cssAspect: "aspect-square" },
      { id: "portrait", label: "Portrait", sub: "9:16 — IG Story", ar: "9:16", cssAspect: "aspect-[9/16]" },
      { id: "billboard", label: "Billboard", sub: "4:1 — Spanduk Panjang", ar: "4:1", cssAspect: "aspect-[4/1]" }
    ];

    const AI_TOOLS = [
      { id: "ideogram", name: "Ideogram 2.0", tag: "--style typography --v 2.0", note: "Sangat direkomendasikan untuk ejaan teks Bahasa Indonesia yang bersih & rapi." },
      { id: "midjourney", name: "Midjourney v6", tag: "--ar {AR} --v 6.0 --style raw", note: "Hasil visual sinematik & realitis. Disarankan teks headline dipersingkat." },
      { id: "flux", name: "Flux.1 (Dev)", tag: "aspect ratio {AR}, ultra sharp typography details", note: "Ketajaman rendering objek & pencahayaan kualitas tinggi." },
      { id: "dalle", name: "DALL-E 3 (ChatGPT)", tag: "Create banner design in {AR} aspect ratio with clean typography rendering.", note: "Dapat langsung dipasang pada obrolan ChatGPT Plus." }
    ];

    function App() {
      const [bisnis, setBisnis] = useState(BISNIS[3]); // Default Cafe
      const [mood, setMood] = useState(MOODS[0]);
      const [palette, setPalette] = useState(PALETTES[2]); // Hitam & Gold
      const [ukuran, setUkuran] = useState(UKURAN[0]);
      const [aiTool, setAiTool] = useState(AI_TOOLS[0]);

      const [form, setForm] = useState({
        nama: "Masbay Coffee & Eatery",
        tagline: "Tempat Nongkrong Kopi Kekinian",
        promo: "BUY 1 GET 1 FREE KOPI",
        harga: "Mulai Rp 15.000",
        telepon: "0857-9900-1122",
        alamat: "Jl. Pemuda No. 8, Surakarta",
        visualExtra: "iced artisan boba milk tea and espresso glass with condensation drops, roasted coffee beans background"
      });

      const [resultPrompt, setResultPrompt] = useState("");
      const [copied, setCopied] = useState(false);
      const [showMockupModal, setShowMockupModal] = useState(false);

      const updateField = (k, v) => {
        setForm(prev => ({ ...prev, [k]: v }));
      };

      // Auto Fill Sample Data
      const loadQuickSample = () => {
        const randomBisnis = BISNIS[Math.floor(Math.random() * BISNIS.length)];
        setBisnis(randomBisnis);
        setForm({
          nama: randomBisnis.sampleName,
          tagline: randomBisnis.sampleTag,
          promo: randomBisnis.samplePromo,
          harga: randomBisnis.sampleHarga,
          telepon: randomBisnis.samplePhone,
          alamat: randomBisnis.sampleAddr,
          visualExtra: randomBisnis.visualEn
        });
      };

      // Generate Engine Prompt Logic
      const generatePrompt = () => {
        const headlineText = form.promo.trim() || form.tagline.trim() || "PROMO SPESIAL";
        const subtext = form.tagline.trim();
        const ctaText = form.telepon ? `WA: ${form.telepon}` : "HUBUNGI KAMI SEKARANG";
        const heroVisual = form.visualExtra.trim() || bisnis.visualEn;

        let prompt = `Commercial promotional banner design for business named "${form.nama}" operating in ${bisnis.val}.\n\n`;
        prompt += `ASPECT RATIO / FORMAT: ${ukuran.ar} (${ukuran.sub}).\n`;
        prompt += `VISUAL STYLE & MOOD: ${mood.val}. ${mood.layoutEn}.\n`;
        prompt += `COLOR PALETTE: ${palette.val}.\n`;
        prompt += `HERO VISUAL ELEMENT: ${heroVisual}.\n\n`;
        prompt += `TEXT & TYPOGRAPHY LAYOUT (Must render exact Indonesian text strings cleanly):\n`;
        prompt += `• MAIN HEADLINE (Bold, high contrast, largest font): "${headlineText.toUpperCase()}"\n`;
        prompt += `• BRAND NAME (Prominent positioning): "${form.nama}"\n`;
        if (subtext && subtext.toUpperCase() !== headlineText.toUpperCase()) {
          prompt += `• SUB-HEADLINE (Secondary size): "${subtext}"\n`;
        }
        if (form.harga) {
          prompt += `• PRICE BADGE (Eye-catching highlight box): "${form.harga}"\n`;
        }
        prompt += `• CALL TO ACTION BUTTON (Contrasting button): "${ctaText}"\n`;
        if (form.alamat) {
          prompt += `• LOCATION FOOTER: "${form.alamat}"\n\n`;
        }

        const engineTag = aiTool.tag.replace("{AR}", ukuran.ar);
        prompt += `AI GENERATION PARAMETERS: ${engineTag}`;

        setResultPrompt(prompt);
      };

      // Auto update prompt saat opsi berubah
      useEffect(() => {
        generatePrompt();
      }, [bisnis, mood, palette, ukuran, aiTool, form]);

      // Copy Clipboard Handler
      const copyToClipboard = () => {
        if (!resultPrompt) return;
        const tempTextarea = document.createElement("textarea");
        tempTextarea.value = resultPrompt;
        document.body.appendChild(tempTextarea);
        tempTextarea.select();
        document.execCommand("copy");
        document.body.removeChild(tempTextarea);

        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      // Hitung kata pada Teks Promo untuk peringatan ejaan AI
      const headlineWords = form.promo.trim() ? form.promo.trim().split(/\s+/).length : 0;
      const isHeadlineTooLong = headlineWords > 5;

      return (
        <div class="min-h-screen flex flex-col justify-between pb-12">
          <div>
            {/* Header */}
            <header class="bg-darkcard/95 backdrop-blur border-b border-darkborder sticky top-0 z-40 px-4 sm:px-8 py-4 shadow-lg">
              <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                  <div class="bg-brand text-black font-heading font-extrabold text-xs px-2.5 py-1 rounded-lg tracking-wider shadow-md shadow-brand/20 flex items-center gap-1.5">
                    <i class="fa-solid fa-bolt"></i>
                    <span>MASBAY v2.0</span>
                  </div>
                  <div>
                    <h1 class="font-heading font-bold text-base sm:text-xl text-white leading-tight">
                      AI Prompt Generator
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block">Engine Pembuat Prompt Spanduk/Banner UMKM Presisi</p>
                  </div>
                </div>

                <div class="flex items-center gap-2.5">
                  <button 
                    onClick={loadQuickSample} 
                    class="text-xs bg-darksurface hover:bg-slate-800 text-brand px-3.5 py-2 rounded-xl border border-brand/30 transition flex items-center gap-2 font-medium shadow-sm"
                  >
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>⚡ Isi Contoh Data Instan</span>
                  </button>

                  <button 
                    onClick={() => setShowMockupModal(true)} 
                    class="text-xs bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 px-3.5 py-2 rounded-xl transition flex items-center gap-2 font-medium"
                  >
                    <i class="fa-solid fa-eye"></i>
                    <span>👁️ Preview Skema Banner</span>
                  </button>
                </div>
              </div>
            </header>

            {/* Content Container */}
            <main class="max-w-6xl mx-auto px-4 sm:px-6 mt-8 space-y-6">

              {/* Step 1: Kategori Bisnis */}
              <section class="bg-darkcard border border-darkborder rounded-2xl p-5 shadow-xl">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-xs font-bold text-brand uppercase tracking-wider flex items-center gap-2">
                    <span class="w-5 h-5 rounded-full bg-brand text-black flex items-center justify-center text-[10px] font-extrabold">1</span>
                    Pilih Kategori Bisnis UMKM
                  </h2>
                  <span class="text-[11px] text-slate-400">Terpilih: <strong class="text-white">{bisnis.label}</strong></span>
                </div>
                
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2.5">
                  {BISNIS.map(b => (
                    <button 
                      key={b.id} 
                      onClick={() => {
                        setBisnis(b);
                        updateField("visualExtra", b.visualEn);
                      }} 
                      class={`p-3 rounded-xl border text-left text-xs transition-all flex flex-col items-center justify-center text-center gap-2 ${
                        bisnis.id === b.id 
                          ? 'bg-brand/10 border-brand text-brand font-semibold shadow-lg shadow-brand/5 scale-[1.02]' 
                          : 'bg-darkbg border-darkborder text-slate-300 hover:border-slate-700 hover:bg-darksurface'
                      }`}
                    >
                      <span class="text-2xl">{b.icon}</span>
                      <span class="line-clamp-1">{b.label}</span>
                    </button>
                  ))}
                </div>
              </section>

              {/* Step 2: Form Informasi Banner */}
              <section class="bg-darkcard border border-darkborder rounded-2xl p-5 shadow-xl">
                <h2 class="text-xs font-bold text-brand uppercase tracking-wider mb-4 flex items-center gap-2">
                  <span class="w-5 h-5 rounded-full bg-brand text-black flex items-center justify-center text-[10px] font-extrabold">2</span>
                  Informasi Teks Spanduk / Banner
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nama Bisnis / Brand</label>
                    <input 
                      type="text" 
                      class="w-full bg-darkbg border border-darkborder rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand transition" 
                      placeholder="Contoh: Bengkel Masbay"
                      value={form.nama} 
                      onChange={e => updateField("nama", e.target.value)} 
                    />
                  </div>

                  <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Tagline / Deskripsi Singkat</label>
                    <input 
                      type="text" 
                      class="w-full bg-darkbg border border-darkborder rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand transition" 
                      placeholder="Contoh: Servis Cepat & Bergaransi"
                      value={form.tagline} 
                      onChange={e => updateField("tagline", e.target.value)} 
                    />
                  </div>

                  <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Teks Promo / Headline Utama</label>
                    <input 
                      type="text" 
                      class="w-full bg-darkbg border border-darkborder rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand transition" 
                      placeholder="Contoh: DISKON 20% SERVIS TOTAL"
                      value={form.promo} 
                      onChange={e => updateField("promo", e.target.value)} 
                    />
                  </div>

                  <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Badge Harga / Penawaran</label>
                    <input 
                      type="text" 
                      class="w-full bg-darkbg border border-darkborder rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand transition" 
                      placeholder="Contoh: Mulai Rp 15.000"
                      value={form.harga} 
                      onChange={e => updateField("harga", e.target.value)} 
                    />
                  </div>

                  <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">No. WA / Kontak</label>
                    <input 
                      type="text" 
                      class="w-full bg-darkbg border border-darkborder rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand transition" 
                      placeholder="Contoh: 0812-3456-7890"
                      value={form.telepon} 
                      onChange={e => updateField("telepon", e.target.value)} 
                    />
                  </div>

                  <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Alamat Singkat</label>
                    <input 
                      type="text" 
                      class="w-full bg-darkbg border border-darkborder rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand transition" 
                      placeholder="Contoh: Jl. Mojosongo No. 12, Surakarta"
                      value={form.alamat} 
                      onChange={e => updateField("alamat", e.target.value)} 
                    />
                  </div>
                </div>

                {/* Indikator Peringatan Panjang Headline */}
                {isHeadlineTooLong && (
                  <div class="mt-4 bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 flex items-start gap-2 text-amber-300 text-xs">
                    <i class="fa-solid fa-triangle-exclamation text-amber-400 text-base mt-0.5"></i>
                    <div>
                      <strong>⚠️ Tips: Teks headline &gt;5 kata ({headlineWords} kata saat ini) rentan typo di AI visual. Buat lebih singkat!</strong>
                    </div>
                  </div>
                )}
              </section>

              {/* Step 3: Style Visual & Warna */}
              <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                {/* Mood Selection */}
                <div class="bg-darkcard border border-darkborder rounded-2xl p-5 shadow-xl">
                  <h2 class="text-xs font-bold text-brand uppercase tracking-wider mb-3 flex items-center gap-2">
                    <span class="w-5 h-5 rounded-full bg-brand text-black flex items-center justify-center text-[10px] font-extrabold">3</span>
                    Gaya Visual & Mood
                  </h2>
                  
                  <div class="grid grid-cols-2 gap-2">
                    {MOODS.map(m => (
                      <button 
                        key={m.id} 
                        onClick={() => setMood(m)}
                        class={`p-3 rounded-xl border text-left text-xs transition-all ${
                          mood.id === m.id 
                            ? 'bg-brand/10 border-brand text-brand font-semibold shadow-md' 
                            : 'bg-darkbg border-darkborder text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div class="font-medium">{m.label}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Palette Selection */}
                <div class="bg-darkcard border border-darkborder rounded-2xl p-5 shadow-xl">
                  <h2 class="text-xs font-bold text-brand uppercase tracking-wider mb-3 flex items-center gap-2">
                    <span class="w-5 h-5 rounded-full bg-brand text-black flex items-center justify-center text-[10px] font-extrabold">4</span>
                    Palet Warna Dominan
                  </h2>

                  <div class="grid grid-cols-2 gap-2">
                    {PALETTES.map(p => (
                      <button 
                        key={p.id} 
                        onClick={() => setPalette(p)}
                        class={`p-3 rounded-xl border text-left text-xs transition-all flex items-center gap-2.5 ${
                          palette.id === p.id 
                            ? 'bg-brand/10 border-brand text-white font-semibold shadow-md' 
                            : 'bg-darkbg border-darkborder text-slate-400 hover:border-slate-700'
                        }`}
                      >
                        <div class={`w-5 h-5 rounded-md bg-gradient-to-r ${p.bg} border border-white/20 flex-shrink-0`}></div>
                        <span class="truncate">{p.label}</span>
                      </button>
                    ))}
                  </div>
                </div>

              </section>

              {/* Step 4: Ukuran & Engine AI */}
              <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                {/* Aspek Rasio Ukuran */}
                <div class="bg-darkcard border border-darkborder rounded-2xl p-5 shadow-xl">
                  <h2 class="text-xs font-bold text-brand uppercase tracking-wider mb-3 flex items-center gap-2">
                    <span class="w-5 h-5 rounded-full bg-brand text-black flex items-center justify-center text-[10px] font-extrabold">5</span>
                    Format & Rasio Ukuran Spanduk
                  </h2>

                  <div class="grid grid-cols-2 gap-2.5">
                    {UKURAN.map(u => (
                      <button 
                        key={u.id} 
                        onClick={() => setUkuran(u)}
                        class={`p-3 rounded-xl border text-left text-xs transition-all ${
                          ukuran.id === u.id 
                            ? 'bg-brand/10 border-brand text-brand font-semibold shadow-md' 
                            : 'bg-darkbg border-darkborder text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div class="font-bold text-white text-sm">{u.label}</div>
                        <div class="text-[10px] text-slate-400 mt-0.5">{u.sub}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Target AI Engine */}
                <div class="bg-darkcard border border-darkborder rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                  <div>
                    <h2 class="text-xs font-bold text-brand uppercase tracking-wider mb-3 flex items-center gap-2">
                      <span class="w-5 h-5 rounded-full bg-brand text-black flex items-center justify-center text-[10px] font-extrabold">6</span>
                      Target Platform AI Image Generator
                    </h2>

                    <div class="grid grid-cols-2 gap-2">
                      {AI_TOOLS.map(a => (
                        <button 
                          key={a.id} 
                          onClick={() => setAiTool(a)}
                          class={`p-2.5 rounded-xl border text-left text-xs transition-all ${
                            aiTool.id === a.id 
                              ? 'bg-cyan-500/10 border-cyan-400 text-cyan-300 font-semibold shadow-md' 
                              : 'bg-darkbg border-darkborder text-slate-400 hover:border-slate-700'
                          }`}
                        >
                          <div class="font-medium text-white">{a.name}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div class="mt-4 bg-cyan-950/20 border border-cyan-800/40 p-3 rounded-xl text-[11px] text-cyan-200/90 flex items-start gap-2">
                    <i class="fa-solid fa-lightbulb text-cyan-400 text-sm mt-0.5"></i>
                    <div>
                      <strong>Petunjuk Engine {aiTool.name}:</strong> {aiTool.note}
                    </div>
                  </div>
                </div>

              </section>

              {/* Action Button Generate Manual */}
              <button 
                onClick={generatePrompt} 
                class="w-full bg-gradient-to-r from-brand to-amber-500 hover:from-amber-400 hover:to-brand text-black font-heading font-bold text-base py-4 rounded-xl shadow-lg shadow-brand/10 transition transform active:scale-[0.99] flex items-center justify-center gap-2"
              >
                <i class="fa-solid fa-bolt text-lg"></i>
                <span>⚡ Generate Prompt Presisi Sekarang</span>
              </button>

              {/* Output Display & Copy Section */}
              <section class="bg-darkcard border border-darkborder rounded-2xl p-5 shadow-2xl space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-darkborder pb-3">
                  <div class="flex items-center gap-2">
                    <i class="fa-solid fa-code text-brand text-base"></i>
                    <h3 class="text-sm font-bold text-white uppercase tracking-wider font-heading">Hasil Prompt Spanduk Presisi</h3>
                  </div>

                  <button 
                    onClick={copyToClipboard}
                    class="text-xs bg-brand hover:bg-brandHover text-black font-bold px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-md shadow-brand/10"
                  >
                    <i class="fa-solid fa-copy"></i>
                    <span>{copied ? "✅ Tersalin ke Clipboard!" : "📋 Copy Prompt"}</span>
                  </button>
                </div>

                <div class="relative">
                  <textarea 
                    readOnly 
                    rows="10" 
                    class="w-full bg-darkbg border border-darkborder rounded-xl p-4 text-xs font-mono text-slate-200 leading-relaxed focus:outline-none focus:border-brand/50 select-all"
                    value={resultPrompt}
                  ></textarea>
                </div>
              </section>

            </main>
          </div>

          {/* Interactive Modal Preview Skema Banner */}
          {showMockupModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-darkcard border border-darkborder rounded-2xl max-w-lg w-full p-6 shadow-2xl relative space-y-4">
                <button 
                  onClick={() => setShowMockupModal(false)}
                  class="absolute top-4 right-4 text-slate-400 hover:text-white w-8 h-8 rounded-full bg-darkbg flex items-center justify-center border border-darkborder"
                >
                  ✕
                </button>

                <div>
                  <h3 class="text-base font-bold text-white font-heading flex items-center gap-2">
                    <i class="fa-solid fa-compass-drafting text-brand"></i>
                    Skema Komposisi Banner AI
                  </h3>
                  <p class="text-xs text-slate-400">Preview visual posisi elemen & hirarki teks spanduk (Rasio {ukuran.ar})</p>
                </div>

                {/* Canvas Box */}
                <div class="bg-darkbg border border-darkborder rounded-xl p-4 flex items-center justify-center min-h-[260px]">
                  <div class={`w-full max-w-xs ${ukuran.cssAspect} bg-gradient-to-br ${palette.bg} rounded-lg p-3 border border-white/20 flex flex-col justify-between shadow-2xl relative overflow-hidden text-center`}>
                    
                    {/* Brand Name Top */}
                    <div class="z-10">
                      <span class="inline-block bg-black/60 text-brand text-[10px] font-bold px-2 py-0.5 rounded border border-brand/30 uppercase tracking-wider">
                        {form.nama || "NAMA BISNIS"}
                      </span>
                    </div>

                    {/* Headline Center */}
                    <div class="z-10 my-auto py-2">
                      <div class="text-3xl mb-1 drop-shadow-md">{bisnis.icon}</div>
                      <h4 class="font-heading font-extrabold text-sm sm:text-base leading-tight uppercase tracking-wide drop-shadow text-white">
                        {form.promo.toUpperCase() || "HEADLINE PROMO"}
                      </h4>
                      {form.tagline && (
                        <p class="text-[10px] text-slate-200 mt-0.5 line-clamp-1 italic">{form.tagline}</p>
                      )}
                    </div>

                    {/* Footer CTA & Price */}
                    <div class="z-10 space-y-1 mt-auto">
                      {form.harga && (
                        <div class="inline-block bg-brand text-black font-extrabold text-[10px] px-2 py-0.5 rounded shadow">
                          {form.harga}
                        </div>
                      )}
                      <div class="bg-white text-black font-bold text-[9px] py-1 px-3 rounded-md shadow uppercase tracking-wider mx-auto w-fit">
                        {form.telepon ? `WA: ${form.telepon}` : "HUBUNGI SEKARANG"}
                      </div>
                      {form.alamat && (
                        <div class="text-[8px] text-slate-300 line-clamp-1">{form.alamat}</div>
                      )}
                    </div>
                  </div>
                </div>

                <div class="text-right">
                  <button 
                    onClick={() => setShowMockupModal(false)}
                    class="bg-brand hover:bg-brandHover text-black font-bold text-xs px-4 py-2 rounded-xl"
                  >
                    Tutup Preview
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer class="mt-12 text-center text-xs text-slate-500 border-t border-darkborder py-6 px-4">
            <p>MASBAY Generator v2.0 · Engine Pembuat Prompt Spanduk AI Presisi 🚀</p>
            <p class="text-[11px] text-slate-600 mt-1">Ciptaan Bayu Nurcahyo (Mahasiswa Bisnis Digital POLITEKNIK AKBARA SURAKARTA)</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
